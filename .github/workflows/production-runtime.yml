name: Integrar runtime de producción

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnosticar suscripción y teléfono real de Meta
        shell: bash
        run: |
          set -e
          echo "=== CITABOT META HEALTH ==="
          curl --fail-with-body --silent --show-error --max-time 30 \
            https://rphyhaoxwvaezulvhcrf.supabase.co/functions/v1/citabot-meta-health
          echo
          echo "=== FIN META HEALTH ==="

      - name: Integrar runtime sin duplicar
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = 'CITABOT_PRODUCTION_RUNTIME_V1'
          injection = '\n<!-- CITABOT_PRODUCTION_RUNTIME_V1 -->\n<script src="./citabot-production-runtime.js"></script>\n'
          if marker not in text:
              text = text.replace('</body>', injection + '</body>', 1)
              print('Runtime integrado en index.html')
          else:
              print('Runtime ya integrado')

          closure_marker = 'CITABOT_PRODUCTION_CLOSURE_V1'
          closure = '\n<!-- CITABOT_PRODUCTION_CLOSURE_V1 -->\n<script src="./citabot-production-closure.js"></script>\n'
          if closure_marker not in text:
              text = text.replace('</body>', closure + '</body>', 1)
              print('Cierre de producción integrado en index.html')
          else:
              print('Cierre de producción ya integrado')
          p.write_text(text, encoding='utf-8')

      - name: Commit automático
        shell: bash
        run: |
          git config user.name "CitaBot Production"
          git config user.email "actions@github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "Integrar cierre de producción en CitaBot"
          git push
