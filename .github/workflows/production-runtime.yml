name: Integrar runtime de producción

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrar runtime sin duplicar
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = 'CITABOT_PRODUCTION_RUNTIME_V1'
          if marker not in text:
              injection = '\n<!-- CITABOT_PRODUCTION_RUNTIME_V1 -->\n<script src="./citabot-production-runtime.js"></script>\n'
              text = text.replace('</body>', injection + '</body>', 1)
              p.write_text(text, encoding='utf-8')
              print('Runtime integrado en index.html')
          else:
              print('Runtime ya integrado')

      - name: Commit automático
        shell: bash
        run: |
          git config user.name "CitaBot Production"
          git config user.email "actions@github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "Integrar runtime de producción en CitaBot"
          git push
