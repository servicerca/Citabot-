name: CitaBot production browser E2E

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.55.0

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium

      - name: Run production browser smoke
        env:
          BASE_URL: https://servicerca.github.io/Citabot-/
        run: npx playwright@1.55.0 test e2e/browser-smoke.spec.cjs --reporter=line
