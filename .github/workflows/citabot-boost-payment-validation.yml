name: CitaBot boost payment validation
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "fix/citabot-boost-payment-amount-currency-20261014"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-payment-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run isolated payment validation tests
        run: deno test supabase/functions/citabot-mercadopago-webhook/payment-validation.test.ts

  refund-status-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: citabot_boost_status_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d citabot_boost_status_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/citabot_boost_status_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PostgreSQL client
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi
      - name: Create disposable existing-schema fixture
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f tests/citabot-boost-status-migration-fixture.sql
      - name: Apply refund-state migration
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261014052344_citabot_allow_refunded_boost_orders.sql
      - name: Verify all documented order states
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f tests/citabot-boost-status-migration.sql
      - name: Create disposable subscription-reconciliation fixture
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f tests/citabot-professional-reconciliation-fixture.sql
      - name: Apply Professional reconciliation migration
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20261018070000_citabot_allow_professional_subscription_reconciliation.sql
      - name: Verify Professional reconciliation, race lock, and client privileges
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f tests/citabot-professional-reconciliation-migration.sql
