name: CitaBot public pricing UX guard

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "scripts/check-pricing-cta.mjs"
      - ".github/workflows/citabot-pricing-ux.yml"
  pull_request:
    paths:
      - "index.html"
      - "scripts/check-pricing-cta.mjs"
      - ".github/workflows/citabot-pricing-ux.yml"

permissions:
  contents: read

jobs:
  pricing-cta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify public Premium signup action
        run: node scripts/check-pricing-cta.mjs
      - name: Require leaked-password check to fail closed
        run: node scripts/check-password-check-fails-closed.mjs
