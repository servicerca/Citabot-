name: Activar sincronización Meta WhatsApp

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Añadir sincronización Meta una sola vez
        shell: python
        run: |
          from pathlib import Path
          p=Path('citabot-production-runtime.js')
          text=p.read_text(encoding='utf-8')
          marker='CITABOT_META_SYNC_V1'
          if marker in text:
              print('Meta sync ya integrado')
          else:
              old="if(b){ await load(); document.getElementById('landing')?.classList.remove('active');"
              new="if(b){ try { await client.functions.invoke('citabot-meta-sync',{body:{}}); } catch(e) { console.warn('Meta sync pendiente:',e); } await load(); document.getElementById('landing')?.classList.remove('active');"
              if old not in text:
                  raise SystemExit('No se encontró el punto de integración esperado')
              text=text.replace(old,new,1)
              text='// CITABOT_META_SYNC_V1\n'+text
              p.write_text(text,encoding='utf-8')
      - name: Commit automático
        shell: bash
        run: |
          git config user.name "CitaBot Production"
          git config user.email "actions@github.com"
          git add citabot-production-runtime.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sincronizar suscripción Meta desde CitaBot"
          git push
