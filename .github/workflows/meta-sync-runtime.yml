name: Activar sincronización Meta WhatsApp

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrar sincronización Meta con diagnóstico visible
        shell: python
        run: |
          from pathlib import Path
          p=Path('citabot-production-runtime.js')
          text=p.read_text(encoding='utf-8')
          old="if(b){ try { await client.functions.invoke('citabot-meta-sync',{body:{}}); } catch(e) { console.warn('Meta sync pendiente:',e); } await load(); document.getElementById('landing')?.classList.remove('active');"
          new="if(b){ try { const sync=await client.functions.invoke('citabot-meta-sync',{body:{}}); if(sync.error) throw sync.error; if(sync.data?.subscribed!==true) throw new Error('Meta no confirmó la suscripción de WhatsApp'); toast('WhatsApp + Meta sincronizados correctamente'); } catch(e) { console.error('CITABOT_META_SYNC_ERROR',e); toast('WhatsApp/Meta pendiente: '+(e?.message||'no se pudo confirmar la suscripción')); } await load(); document.getElementById('landing')?.classList.remove('active');"
          if old in text:
              text=text.replace(old,new,1)
              p.write_text(text,encoding='utf-8')
              print('Diagnóstico Meta integrado')
          elif 'WhatsApp + Meta sincronizados correctamente' in text:
              print('Diagnóstico Meta ya integrado')
          else:
              raise SystemExit('No se encontró el bloque de sincronización Meta esperado')
      - name: Commit automático
        shell: bash
        run: |
          git config user.name "CitaBot Production"
          git config user.email "actions@github.com"
          git add citabot-production-runtime.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Mostrar estado real de sincronización Meta"
          git push
