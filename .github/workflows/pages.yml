name: Publicar CitaBot en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar HTML y JavaScript de producción
        shell: python
        run: |
          import re
          import subprocess
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          assert "https://rphyhaoxwvaezulvhcrf.supabase.co" in html
          assert "CitaBot" in html

          scripts = re.findall(r"<script\b([^>]*)>([\s\S]*?)</script>", html, flags=re.I)
          inline = 0
          for i, (attrs, body) in enumerate(scripts, 1):
              if re.search(r"\bsrc\s*=", attrs, flags=re.I):
                  continue
              tmp = Path(f"/tmp/citabot-inline-{i}.js")
              tmp.write_text(body, encoding="utf-8")
              subprocess.run(["node", "--check", str(tmp)], check=True)
              inline += 1

          assert inline >= 3, f"Se esperaban al menos 3 scripts inline, encontrados: {inline}"
          print(f"CitaBot HTML/JS validation: OK ({inline} scripts inline)")

      - name: Verificar páginas legales
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f politica-privacidad.html
          test -f terminos-servicio.html
          test -f eliminacion-datos.html

      - name: Registrar versión exacta
        shell: bash
        run: |
          set -euo pipefail
          cat > citabot-build.json <<EOF
          {
            "app": "CitaBot",
            "commit": "${GITHUB_SHA}",
            "branch": "${GITHUB_REF_NAME}",
            "workflow": "${GITHUB_WORKFLOW}"
          }
          EOF
          python3 -m json.tool citabot-build.json >/dev/null

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verificar publicación exacta
        shell: bash
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "${PAGES_URL}"
          base="${PAGES_URL%/}"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 20 "$base/citabot-build.json?cb=${EXPECTED_COMMIT}" -o "$tmp"; then
              actual="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["commit"])' "$tmp")"
              if [ "$actual" = "$EXPECTED_COMMIT" ]; then
                echo "GitHub Pages verificado: $actual"
                curl --fail --silent --show-error --location --max-time 20 "$base/index.html?cb=${EXPECTED_COMMIT}" | grep -q "CitaBot"
                exit 0
              fi
            fi
            echo "Pages todavía no refleja el commit esperado; reintentando..."
            sleep 10
          done
          echo "ERROR: GitHub Pages no reflejó el commit ${EXPECTED_COMMIT}."
          exit 1
