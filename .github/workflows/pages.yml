name: Publicar CitaBot en GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "politica-privacidad.html"
      - "terminos-servicio.html"
      - "eliminacion-datos.html"
      - "scripts/check-workspace-pagination.mjs"
      - "scripts/check-platform-admin-navigation.mjs"
      - "scripts/check-whatsapp-marketing-gate.mjs"
      - ".github/workflows/pages.yml"
      - ".github/workflows/browser-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar paginación segura del espacio de trabajo
        run: node scripts/check-workspace-pagination.mjs

      - name: Verificar ámbito de navegación administrativa
        run: node scripts/check-platform-admin-navigation.mjs

      - name: Verificar bloqueo de marketing sin consentimiento
        run: node scripts/check-whatsapp-marketing-gate.mjs

      - name: Validar HTML y JavaScript de producción
        shell: python
        run: |
          import re
          import subprocess
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          assert "https://rphyhaoxwvaezulvhcrf.supabase.co" in html
          assert "CitaBot" in html
          assert "Vista ilustrativa" in html
          assert "tus métricas reales aparecerán cuando conectes tu negocio" in html
          assert "Citas</small><b>Live</b>" not in html
          assert "Clientes</small><b>Reales</b>" not in html
          assert 'name="citabot-version" content="3.5.1-production"' in html
          assert "--shadow-premium" in html
          assert "prefers-reduced-motion" in html
          assert len(re.findall(r'<button\b[^>]*>\s*Explorar negocios\s*</button>', html, flags=re.I)) == 1
          assert "contactCustomerPhone" in html and "contactCustomerTelegram" in html
          assert 'id="navPlatformAdmin"' in html
          assert 'id="view-platform-admin"' in html
          assert "citabot-platform-admin" in html
          assert "platform_admins" in html
          assert 'if(view==="platform-admin"&&window.cbIsPlatformAdmin?.()===true)void window.cbLoadPlatformAdminPanel?.();' in html
          assert 'if(view==="platform-admin"&&window.cbIsPlatformAdmin?.()!==true)' in html
          assert 'window.cbIsPlatformAdmin = () => isPlatformAdmin;' in html
          assert "Servicerca" not in html
          assert "DeseoVIP" not in html
          assert html.lower().count("</html>") == 1
          tail = html.lower().split("</html>", 1)[1].strip()
          assert not tail, "No debe existir contenido fuera de </html>."
          ids = re.findall(r'\bid="([^"]+)"', html, flags=re.I)
          duplicates = sorted({x for x in ids if ids.count(x) > 1})
          assert not duplicates, f"IDs HTML duplicados: {duplicates}"

          scripts = re.findall(r"<script\b([^>]*)>([\s\S]*?)</script>", html, flags=re.I)
          inline = 0
          for i, (attrs, body) in enumerate(scripts, 1):
              if re.search(r"\bsrc\s*=", attrs, flags=re.I):
                  continue
              tmp = Path(f"/tmp/citabot-inline-{i}.js")
              tmp.write_text(body, encoding="utf-8")
              subprocess.run(["node", "--check", str(tmp)], check=True)
              inline += 1

          assert inline >= 3, f"Se esperaban al menos 3 scripts inline, encontrados: {inline}"
          print(f"CitaBot HTML/JS validation: OK ({inline} scripts inline)")

      - name: Verificar páginas legales
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f politica-privacidad.html
          test -f terminos-servicio.html
          test -f eliminacion-datos.html

      - name: Registrar versión exacta
        shell: bash
        run: |
          set -euo pipefail
          cat > citabot-build.json <<EOF
          {
            "app": "CitaBot",
            "commit": "${GITHUB_SHA}",
            "branch": "${GITHUB_REF_NAME}",
            "workflow": "${GITHUB_WORKFLOW}"
          }
          EOF
          python3 -m json.tool citabot-build.json >/dev/null

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar sitio
        id: upload_site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: .

      - name: Publicar
        id: deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload_site.outputs.artifact_id }}
        run: |
          set -euo pipefail
          if [ -z "${ARTIFACT_ID}" ]; then
            echo "::error::GitHub no devolvió el identificador del artefacto de Pages."
            exit 1
          fi

          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT

          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          export OIDC_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$oidc_response")"
          echo "::add-mask::${OIDC_TOKEN}"

          payload="$(python3 -c 'import json,os; print(json.dumps({"artifact_id":int(os.environ["ARTIFACT_ID"]), "environment":"github-pages", "pages_build_version":os.environ["GITHUB_SHA"], "oidc_token":os.environ["OIDC_TOKEN"]}))')"
          api_base="${GITHUB_API_URL:-https://api.github.com}"
          post_status="$(curl --silent --show-error --output "$response" --write-out "%{http_code}" \
            --request POST "${api_base}/repos/${GITHUB_REPOSITORY}/pages/deployments" \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data "$payload")"
          if [ "$post_status" != "200" ]; then
            cat "$response"
            echo "::error::GitHub rechazó la creación del despliegue de Pages (HTTP ${post_status})."
            exit 1
          fi

          deployment_id="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); print(d.get("id") or d.get("status_url","").rstrip("/").split("/")[-1])' "$response")"
          page_url="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("page_url",""))' "$response")"
          if [ -z "$deployment_id" ] || [ -z "$page_url" ]; then
            cat "$response"
            echo "::error::La API de Pages no devolvió el ID o la URL de despliegue."
            exit 1
          fi
          echo "page_url=$page_url" >> "$GITHUB_OUTPUT"
          echo "Despliegue de Pages creado para el commit ${GITHUB_SHA}."

          for attempt in $(seq 1 120); do
            get_status="$(curl --silent --show-error --output "$response" --write-out "%{http_code}" \
              "${api_base}/repos/${GITHUB_REPOSITORY}/pages/deployments/${deployment_id}" \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28")"
            if [ "$get_status" = "200" ]; then
              state="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("status",""))' "$response")"
              case "$state" in
                succeed)
                  echo "GitHub Pages confirmó el despliegue: ${page_url}"
                  exit 0
                  ;;
                deployment_failed|deployment_content_failed|deployment_cancelled|deployment_lost)
                  cat "$response"
                  echo "::error::GitHub Pages terminó con estado ${state}."
                  exit 1
                  ;;
                *)
                  echo "GitHub Pages sigue procesando el commit ${GITHUB_SHA}; estado: ${state:-pendiente}."
                  ;;
              esac
            else
              echo "La consulta del estado de Pages devolvió HTTP ${get_status}; se reintentará."
            fi
            sleep 5
          done

          echo "::error::Se agotó el tiempo de espera del despliegue de GitHub Pages."
          exit 1

      - name: Verificar publicación exacta
        shell: bash
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "${PAGES_URL}"
          base="${PAGES_URL%/}"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 20 "$base/citabot-build.json?cb=${EXPECTED_COMMIT}" -o "$tmp"; then
              actual="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["commit"])' "$tmp")"
              if [ "$actual" = "$EXPECTED_COMMIT" ]; then
                echo "GitHub Pages verificado: $actual"
                curl --fail --silent --show-error --location --max-time 20 "$base/index.html?cb=${EXPECTED_COMMIT}" -o /tmp/citabot-pages-index.html
                grep -q "CitaBot" /tmp/citabot-pages-index.html
                rm -f /tmp/citabot-pages-index.html
                exit 0
              fi
            fi
            echo "Pages todavía no refleja el commit esperado; reintentando..."
            sleep 10
          done
          echo "ERROR: GitHub Pages no reflejó el commit ${EXPECTED_COMMIT}."
          exit 1
