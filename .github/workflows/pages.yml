name: Publicar CitaBot en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Validar JavaScript de producción
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('citabot-production-runtime.js')
          s=p.read_text(encoding='utf-8').replace('\\n','\n')
          p.write_text(s,encoding='utf-8')
          PY
          sed -i 's/\\$//' citabot-production-runtime.js
          if grep -n '\\$' citabot-production-runtime.js; then exit 1; fi
          node --check citabot-production-runtime.js
          node --check citabot-production-closure.js
          node --check citabot-live-data-guard.js
          node --check citabot-mercadopago.js
          git diff --check

      - name: Preparar bundle de producción
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          guard='<script src="./citabot-live-data-guard.js"></script>'
          runtime='<script src="./citabot-production-runtime.js"></script>'
          closure='<script src="./citabot-production-closure.js"></script>'
          billing='<script src="./citabot-mercadopago.js"></script>'
          for tag in (guard,runtime,closure,billing): s=s.replace(tag,'')
          if runtime in s: s=s.replace(runtime,guard+'\n'+runtime,1)
          else: s=s.replace('</body>',guard+'\n</body>',1)
          s=s.replace('</body>',closure+'\n'+billing+'\n</body>',1)
          for name in ('citabot-live-data-guard.js','citabot-production-runtime.js','citabot-production-closure.js','citabot-mercadopago.js'):
              s=s.replace(f'src="./{name}"',f'src="./{name}?cb=${{GITHUB_SHA}}"')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'citabot-live-data-guard.js?cb=${GITHUB_SHA}' index.html
          grep -q 'citabot-production-runtime.js?cb=${GITHUB_SHA}' index.html
          grep -q 'citabot-production-closure.js?cb=${GITHUB_SHA}' index.html
          grep -q 'citabot-mercadopago.js?cb=${GITHUB_SHA}' index.html

      - name: Verificar archivos requeridos
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f citabot-production-runtime.js
          test -f citabot-production-closure.js
          test -f citabot-live-data-guard.js
          test -f citabot-mercadopago.js
          grep -q 'citabot-whatsapp-send' citabot-production-runtime.js citabot-production-closure.js
          grep -q 'citabot-public-booking' citabot-production-closure.js
          grep -q 'citabot-mercadopago-subscribe' citabot-mercadopago.js

      - name: Registrar versión exacta
        shell: bash
        run: |
          set -euo pipefail
          cat > citabot-build.json <<EOF
          {"app":"CitaBot","commit":"${GITHUB_SHA}","branch":"${GITHUB_REF_NAME}","workflow":"${GITHUB_WORKFLOW}"}
          EOF
          python3 -m json.tool citabot-build.json >/dev/null

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verificar publicación
        shell: bash
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="${PAGES_URL%/}"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 20 "$base/citabot-build.json?cb=${EXPECTED_COMMIT}" -o "$tmp"; then
              actual="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1],encoding="utf-8"))["commit"])' "$tmp")"
              if [ "$actual" = "$EXPECTED_COMMIT" ]; then
                curl --fail --silent --show-error --location --max-time 20 "$base/index.html?cb=${EXPECTED_COMMIT}" | grep -q 'citabot-mercadopago.js?cb='
                echo "GitHub Pages verificado: $actual"
                exit 0
              fi
            fi
            sleep 10
          done
          echo "ERROR: GitHub Pages no verificó el commit esperado."
          exit 1
