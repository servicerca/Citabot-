name: Publicar CitaBot en GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Reparar y validar runtime de producción
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/\\$//' citabot-production-runtime.js
          if grep -n '\\$' citabot-production-runtime.js; then
            echo 'Quedan barras invertidas inválidas al final de líneas.'
            exit 1
          fi
          node --check citabot-production-runtime.js
          node --check citabot-production-closure.js
          node --check citabot-live-data-guard.js
          git diff --check

      - name: Colocar guardia de datos reales antes del runtime y romper cache de scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          guard='<script src="./citabot-live-data-guard.js"></script>'
          runtime='<script src="./citabot-production-runtime.js"></script>'
          closure='<script src="./citabot-production-closure.js"></script>'
          s=s.replace(guard,'')
          s=s.replace('./citabot-live-data-guard.js?cb=','./citabot-live-data-guard.js')
          s=s.replace('./citabot-production-runtime.js?cb=','./citabot-production-runtime.js')
          s=s.replace('./citabot-production-closure.js?cb=','./citabot-production-closure.js')
          if runtime in s:
              s=s.replace(runtime,guard+'\n'+runtime,1)
          else:
              s=s.replace('</body>',guard+'\n</body>',1)
          s=s.replace('src="./citabot-live-data-guard.js"','src="./citabot-live-data-guard.js?cb=${GITHUB_SHA}"')
          s=s.replace('src="./citabot-production-runtime.js"','src="./citabot-production-runtime.js?cb=${GITHUB_SHA}"')
          s=s.replace('src="./citabot-production-closure.js"','src="./citabot-production-closure.js?cb=${GITHUB_SHA}"')
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'citabot-live-data-guard.js?cb=${GITHUB_SHA}' index.html
          grep -q 'citabot-production-runtime.js?cb=${GITHUB_SHA}' index.html
          grep -q 'citabot-production-closure.js?cb=${GITHUB_SHA}' index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.index('citabot-live-data-guard.js?cb=${GITHUB_SHA}') < s.index('citabot-production-runtime.js?cb=${GITHUB_SHA}')
          PY

      - name: Verificar integración de producción
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f citabot-production-runtime.js
          test -f citabot-production-closure.js
          test -f citabot-live-data-guard.js
          grep -q 'citabot-production-runtime.js' index.html
          grep -q 'citabot-production-closure.js' index.html
          grep -q 'citabot-live-data-guard.js' index.html
          grep -q 'citabot-whatsapp-send' citabot-production-runtime.js citabot-production-closure.js
          grep -q 'citabot-public-booking' citabot-production-closure.js
          echo "CitaBot build commit: $(git rev-parse HEAD)"

      - name: Registrar versión exacta del despliegue
        shell: bash
        run: |
          set -euo pipefail
          cat > citabot-build.json <<EOF
          {
            "app": "CitaBot",
            "commit": "${GITHUB_SHA}",
            "branch": "${GITHUB_REF_NAME}",
            "workflow": "${GITHUB_WORKFLOW}"
          }
          EOF
          python3 -m json.tool citabot-build.json >/dev/null

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empaquetar sitio corregido
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verificar que GitHub Pages publicó este commit
        shell: bash
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "${PAGES_URL}"
          base="${PAGES_URL%/}"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 20 "$base/citabot-build.json?cb=${EXPECTED_COMMIT}" -o "$tmp"; then
              actual="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["commit"])' "$tmp")"
              if [ "$actual" = "$EXPECTED_COMMIT" ]; then
                echo "GitHub Pages verificado: $actual"
                curl --fail --silent --show-error --location --max-time 20 "$base/index.html?cb=${EXPECTED_COMMIT}" | grep -q 'citabot-live-data-guard.js?cb='
                curl --fail --silent --show-error --location --max-time 20 "$base/index.html?cb=${EXPECTED_COMMIT}" | grep -q 'citabot-production-runtime.js?cb='
                echo "CitaBot publicado y con guardia + runtime + cierre en producción."
                exit 0
              fi
              echo "Publicación aún apunta a $actual; se esperaba $EXPECTED_COMMIT. Reintentando..."
            else
              echo "GitHub Pages todavía no responde. Reintentando..."
            fi
            sleep 10
          done
          echo "ERROR: GitHub Pages no publicó/verificó el commit $EXPECTED_COMMIT dentro del tiempo de espera."
          exit 1