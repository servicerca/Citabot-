name: CitaBot backend production contracts

on:
  push:
    branches: ["main"]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "scripts/check-public-booking-sanitization.mjs"
      - ".github/workflows/backend-contracts.yml"
  pull_request:
    paths:
      - "supabase/functions/**"
      - "scripts/check-public-booking-sanitization.mjs"
      - ".github/workflows/backend-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-contracts:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://rphyhaoxwvaezulvhcrf.supabase.co
      SUPABASE_KEY: sb_publishable_XjqZnyBiOxC1fLNE9rJxQw_9xzEXquH
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Deno for Edge Function type checks
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check production Edge Functions
        run: deno check supabase/functions/citabot-public-booking/index.ts supabase/functions/citabot-mercadopago-webhook/index.ts supabase/functions/citabot-commercial-sync/index.ts supabase/functions/citabot-commercial-checkout/index.ts

      - name: Reject obsolete database field references
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE '\b(client_id|appointment_date|start_time|end_time)\b' supabase/functions; then
            echo "Found a reference to a removed production appointment field."
            exit 1
          fi
          echo "No obsolete appointment field references found."

      - name: Check public Edge and payment reconciliation safeguards
        run: node scripts/check-public-booking-sanitization.mjs

      - name: Verify public and protected production function contracts
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          call() {
            local expected="$1"
            local method="$2"
            local path="$3"
            local body="${4:-}"
            local response
            local code
            local url="${SUPABASE_URL}/functions/v1/${path}"

            if [ "$method" = "GET" ]; then
              code="$(curl -sS -o /tmp/contract-response -w "%{http_code}" \
                -H "apikey: ${SUPABASE_KEY}" "${url}")"
            else
              code="$(curl -sS -o /tmp/contract-response -w "%{http_code}" \
                -H "apikey: ${SUPABASE_KEY}" \
                -H "Content-Type: application/json" \
                -X "${method}" \
                --data "${body}" "${url}")"
            fi

            response="$(cat /tmp/contract-response)"
            echo "${method} ${path} -> HTTP ${code}: ${response}"

            if [ "${path}" = "citabot-mercadopago-webhook" ] && [ "${expected}" = "401" ] && [[ "${response}" == *"Webhook secret no configurado"* ]]; then
              echo "::error::MERCADOPAGO_WEBHOOK_SECRET is missing from CitaBot's Supabase Edge Function secrets. Add the genuine secret from Mercado Pago; do not disable signature verification."
              exit 1
            fi

            test "${code}" = "${expected}"
          }

          call 400 GET "citabot-public-booking?slug=__invalid_slug_for_ci__"
          call 400 POST "citabot-public-booking" '{}'

          # A valid but unique missing slug must produce only a safe business message.
          missing_slug="citabot-ci-missing-${GITHUB_RUN_ID}"
          call 404 GET "citabot-public-booking?slug=${missing_slug}"
          response="$(cat /tmp/contract-response)"
          test "${response}" = '{"ok":false,"error":"Negocio no disponible."}'

          # Malformed UUIDs are client input errors and must be rejected before PostgREST.
          future="$(date -u -d '+2 days' +%Y-%m-%dT%H:%M:%SZ)"
          booking_error_body="$(printf '{"business_slug":"%s","service_id":"not-a-uuid","customer_name":"CI contract","customer_phone":"3000000000","starts_at":"%s","privacy_consent":true,"whatsapp_consent":true}' "${missing_slug}" "${future}")"
          call 400 POST "citabot-public-booking" "${booking_error_body}"
          response="$(cat /tmp/contract-response)"
          test "${response}" = '{"ok":false,"error":"El identificador del servicio no es válido."}'
          if printf '%s' "${response}" | grep -Eiq 'invalid input syntax|22P02|PGRST|book_appointment_v3'; then
            echo "Internal database details leaked from public booking."
            exit 1
          fi

          # Invalid JSON is a client error, never an unhandled server exception.
          call 400 POST "citabot-public-booking" '{'
          response="$(cat /tmp/contract-response)"
          test "${response}" = '{"ok":false,"error":"El cuerpo de la solicitud no es JSON válido."}'

          call 405 POST "citabot-meta-health"
          call 401 POST "citabot-meta-sync" '{}'
          call 401 POST "citabot-whatsapp-send" '{}'
          call 401 POST "citabot-account-delete" '{}'
          call 401 POST "citabot-commercial-checkout" '{}'
          call 401 POST "citabot-mercadopago-subscribe" '{}'
          call 401 POST "citabot-commercial-sync" '{}'
          call 401 POST "citabot-plan-sync" '{}'
          call 401 POST "citabot-platform-admin" '{}'

          call 200 POST "citabot-mercadopago-webhook" '{}'

          # Forged provider events without signatures must be rejected before any DB mutation.
          call 401 POST "citabot-whatsapp-webhook" '{"entry":[]}'
          response="$(cat /tmp/contract-response)"
          test "${response}" = 'Invalid signature'

          call 401 POST "citabot-mercadopago-webhook" '{"type":"payment","data":{"id":"ci-invalid-signature"}}'
          response="$(cat /tmp/contract-response)"
          test "${response}" = '{"ok":false,"error":"Firma inválida"}'

          echo "CitaBot backend production contracts: OK"
